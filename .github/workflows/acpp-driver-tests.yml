name: acpp driver tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - 'bin/acpp'
      - 'tests/bin/**'
      - '.github/workflows/acpp-driver-tests.yml'

  push:
    branches: [ "develop" ]
    paths:
      - 'bin/acpp'
      - 'tests/bin/**'
      - '.github/workflows/acpp-driver-tests.yml'

jobs:
  test:
    name: "Test : bin/acpp"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: run bin/acpp unit tests
        run: python3 tests/bin/test_filter_cmd_args.py -v
